<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Audio Server</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2d3748 0%, #4a5568 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h1 {
            color: #2d3748;
            font-size: 2.2em;
            margin-bottom: 10px;
        }

        .auth-header p {
            color: #718096;
            font-size: 1em;
        }

        .admin-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #4a5568;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1em;
            background: white;
            z-index: 10;
            position: relative;
        }

        .form-group input:focus {
            outline: none;
            border-color: #4a5568;
            box-shadow: 0 0 0 3px rgba(74, 85, 104, 0.1);
        }

        .form-group input:disabled {
            background: #f7fafc;
            cursor: not-allowed;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: #4a5568;
            color: white;
        }

        .btn-primary:hover {
            background: #2d3748;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #4a5568;
            text-decoration: none;
            display: block;
            text-align: center;
        }

        .btn-secondary:hover {
            background: #cbd5e0;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .loading {
            display: none;
            text-align: center;
            color: #4a5568;
        }

        .form-links {
            text-align: center;
            margin-top: 20px;
        }

        .form-links a {
            color: #4a5568;
            text-decoration: none;
            margin: 0 10px;
        }

        .form-links a:hover {
            text-decoration: underline;
        }

        .security-notice {
            background: #fff3cd;
            color: #856404;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9em;
            border: 1px solid #ffeaa7;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <div class="admin-icon">👨‍🏫</div>
            <h1>Admin Login</h1>
            <p>Sign in to your administrator account</p>
        </div>

        <div class="security-notice">
            <strong>⚠️ Authorized Personnel Only</strong><br>
            This area is restricted to administrators only.
        </div>

        <div id="alert" class="alert"></div>
        <div id="loading" class="loading">Authenticating...</div>

        <form id="admin-login-form">
            <div class="form-group">
                <label for="admin-email">Email Address</label>
                <input type="email" id="admin-email" required placeholder="Enter your admin email" autocomplete="email">
            </div>

            <div class="form-group">
                <label for="admin-password">Password</label>
                <input type="password" id="admin-password" required placeholder="Enter your password" autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-primary">Sign In</button>
            <a href="index.html" class="btn btn-secondary">← Back to Home</a>
        </form>

        <div class="form-links">
            <a href="admin-register.html">Don't have an account? Register</a> |
            <a href="login.html">Student Login</a> |
            <button onclick="testConnection()" style="background: none; border: none; color: #667eea; text-decoration: underline; cursor: pointer;">Test Connection</button>
        </div>
    </div>

    <script>
        console.log('Admin login page loaded');
        
        // Focus on email field immediately
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded');
            const emailField = document.getElementById('admin-email');
            if (emailField) {
                emailField.focus();
                console.log('Email field focused');
            }
        });

        document.getElementById('admin-login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            console.log('Form submitted');
            
            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-password').value;
            
            if (!email) {
                showAlert('Please enter your email address', 'error');
                return;
            }
            
            if (!password) {
                showAlert('Please enter your password', 'error');
                return;
            }
            
            showLoading(true);
            
            try {
                // Auto-detect API base URL with enhanced detection
                let API_BASE_URL;
                let isLocalhost = false;
                
                if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                    // Local development - try multiple ports
                    isLocalhost = true;
                    API_BASE_URL = 'http://localhost:8002';
                } else if (window.location.hostname.includes('github.io')) {
                    // GitHub Pages deployment
                    API_BASE_URL = 'https://api.suprexon.space';
                } else {
                    // Other deployments (fallback)
                    API_BASE_URL = 'https://api.suprexon.space';
                }
                
                console.log(`🔗 Attempting login to: ${API_BASE_URL}`);
                console.log(`📍 Current location: ${window.location.hostname}`);
                console.log(`🌐 Browser online status: ${navigator.onLine}`);
                
                // Create fetch with timeout and enhanced error handling
                const controller = new AbortController();
                const timeoutId = setTimeout(() => {
                    controller.abort();
                    console.error('⏰ Request timed out after 15 seconds');
                }, 15000); // 15 second timeout
                
                let response;
                try {
                    response = await fetch(`${API_BASE_URL}/auth/admin/login`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        credentials: 'include',
                        body: JSON.stringify({ email, password }),
                        signal: controller.signal
                    });
                    
                    clearTimeout(timeoutId);
                    console.log(`📡 Response received: ${response.status} ${response.statusText}`);
                    
                } catch (fetchError) {
                    clearTimeout(timeoutId);
                    
                    if (fetchError.name === 'AbortError') {
                        throw new Error('Connection timeout - server may be unreachable or overloaded');
                    } else if (fetchError.message.includes('ERR_CONNECTION_TIMED_OUT')) {
                        throw new Error('Connection timed out - check your internet connection');
                    } else if (fetchError.message.includes('ERR_CONNECTION_REFUSED')) {
                        throw new Error('Connection refused - server may be down');
                    } else if (fetchError.message.includes('ERR_NETWORK')) {
                        throw new Error('Network error - check your internet connection');
                    } else if (fetchError.message.includes('Failed to fetch')) {
                        // Try alternative URLs for localhost
                        if (isLocalhost) {
                            console.log('🔄 Primary localhost URL failed, trying alternative ports...');
                            const alternativePorts = [8000, 8001, 8003, 8004];
                            for (const port of alternativePorts) {
                                try {
                                    console.log(`🔄 Trying port ${port}...`);
                                    const altController = new AbortController();
                                    const altTimeoutId = setTimeout(() => altController.abort(), 5000);
                                    
                                    response = await fetch(`http://localhost:${port}/auth/admin/login`, {
                                        method: 'POST',
                                        headers: {
                                            'Content-Type': 'application/json',
                                            'Accept': 'application/json'
                                        },
                                        credentials: 'include',
                                        body: JSON.stringify({ email, password }),
                                        signal: altController.signal
                                    });
                                    
                                    clearTimeout(altTimeoutId);
                                    console.log(`✅ Alternative port ${port} worked!`);
                                    API_BASE_URL = `http://localhost:${port}`;
                                    break;
                                } catch (altError) {
                                    console.log(`❌ Port ${port} failed: ${altError.message}`);
                                    continue;
                                }
                            }
                            
                            if (!response) {
                                throw new Error('All localhost ports failed - server may not be running');
                            }
                        } else {
                            // Show special message for tunnel connectivity issues
                            const errorMsg = 'The server tunnel is not accessible from your network. This may be due to ISP restrictions, firewall blocks, or network configuration.';
                            const solutionLink = '<br><br><a href="proxy-login.html" style="color: #fff; text-decoration: underline;">🔧 Try Alternative Login Method</a>';
                            throw new Error(errorMsg + solutionLink);
                        }
                    } else {
                        throw fetchError;
                    }
                }
                
                let result;
                try {
                    result = await response.json();
                } catch (parseError) {
                    console.error('❌ Failed to parse server response:', parseError);
                    throw new Error(`Server returned invalid response (${response.status})`);
                }
                
                if (response.ok && result.success) {
                    console.log('✅ Login successful, storing data and redirecting...', result);
                    showAlert('Login successful! Redirecting...', 'success');
                    
                    // Check if this is a superadmin login
                    const isSuperAdmin = result.role === 'super-admin' || result.admin.isSuperAdmin;
                    
                    // Store admin token and info with enhanced error handling
                    let storageSuccess = false;
                    try {
                        localStorage.setItem('adminToken', result.token);
                        localStorage.setItem('userRole', isSuperAdmin ? 'super-admin' : 'admin');
                        localStorage.setItem('adminId', result.admin.adminId);
                        localStorage.setItem('adminName', result.admin.name);
                        localStorage.setItem('adminEmail', result.admin.email);
                        if (isSuperAdmin) {
                            localStorage.setItem('superAdminToken', result.token);
                        }
                        console.log('✅ Data stored in localStorage');
                        storageSuccess = true;
                    } catch (error) {
                        console.warn('⚠️ localStorage failed, trying sessionStorage:', error);
                        try {
                            // Fallback to sessionStorage for mobile private browsing
                            sessionStorage.setItem('adminToken', result.token);
                            sessionStorage.setItem('userRole', isSuperAdmin ? 'super-admin' : 'admin');
                            sessionStorage.setItem('adminId', result.admin.adminId);
                            sessionStorage.setItem('adminName', result.admin.name);
                            sessionStorage.setItem('adminEmail', result.admin.email);
                            if (isSuperAdmin) {
                                sessionStorage.setItem('superAdminToken', result.token);
                            }
                            console.log('✅ Data stored in sessionStorage');
                            storageSuccess = true;
                        } catch (sessionError) {
                            console.error('❌ Both localStorage and sessionStorage failed:', sessionError);
                            showAlert('Warning: Storage not available. You may need to login again.', 'warning');
                        }
                    }
                    
                    // Enhanced redirect with multiple fallback methods
                    const redirectToAdmin = () => {
                        const targetUrl = isSuperAdmin ? 'super-admin-dashboard.html' : 'admin-ui/index.html';
                        console.log(`🔄 Attempting redirect to ${isSuperAdmin ? 'super admin' : 'admin'} panel: ${targetUrl}`);
                        try {
                            // Method 1: Standard href redirect
                            window.location.href = targetUrl;
                        } catch (redirectError) {
                            console.error('❌ Standard redirect failed, trying alternative:', redirectError);
                            try {
                                // Method 2: Location replace (no history entry)
                                window.location.replace(targetUrl);
                            } catch (replaceError) {
                                console.error('❌ Replace redirect failed, trying assign:', replaceError);
                                try {
                                    // Method 3: Location assign
                                    window.location.assign('admin-ui/index.html');
                                } catch (assignError) {
                                    console.error('❌ All redirect methods failed:', assignError);
                                    showAlert('Redirect failed. Please manually navigate to the admin panel.', 'error');
                                    // Show manual link as last resort
                                    setTimeout(() => {
                                        const linkElement = document.createElement('a');
                                        linkElement.href = 'admin-ui/index.html';
                                        linkElement.textContent = 'Click here to access Admin Panel';
                                        linkElement.style.cssText = 'display: block; text-align: center; margin: 20px; padding: 10px; background: #4CAF50; color: white; text-decoration: none; border-radius: 5px;';
                                        document.body.appendChild(linkElement);
                                    }, 2000);
                                }
                            }
                        }
                    };
                    
                    // Delay redirect to ensure storage completion and show success message
                    setTimeout(redirectToAdmin, 1500);
                    
                } else {
                    console.error('❌ Login failed:', result);
                    showAlert(result.message || result.error || 'Invalid email or password', 'error');
                }
            } catch (error) {
                console.error('❌ Login error:', error);
                
                // Enhanced error messages for different failure types
                let errorMessage = 'Login failed: ';
                let troubleshooting = '';
                
                if (error.message.includes('timeout') || error.message.includes('ERR_CONNECTION_TIMED_OUT')) {
                    errorMessage += 'Connection timeout';
                    troubleshooting = 'Try: 1) Check internet connection 2) Refresh page 3) Wait a moment and try again';
                } else if (error.message.includes('Connection refused') || error.message.includes('server may be down')) {
                    errorMessage += 'Server not responding';
                    troubleshooting = 'The server may be temporarily unavailable. Please try again in a few minutes.';
                } else if (error.message.includes('Failed to connect') || error.message.includes('Failed to fetch')) {
                    errorMessage += 'Cannot connect to server';
                    troubleshooting = 'Check: 1) Internet connection 2) VPN/firewall settings 3) Try different browser';
                } else if (error.message.includes('localhost ports failed')) {
                    errorMessage += 'Local server not running';
                    troubleshooting = 'Start the server with: npm run pm2:start';
                } else if (error.message.includes('Invalid response')) {
                    errorMessage += 'Server error';
                    troubleshooting = 'The server returned an unexpected response. Please try again.';
                } else {
                    errorMessage += error.message;
                    troubleshooting = 'Please check your internet connection and try again.';
                }
                
                showAlert(errorMessage, 'error');
                
                if (troubleshooting) {
                    setTimeout(() => {
                        const alertDiv = document.getElementById('alert');
                        if (alertDiv && alertDiv.style.display !== 'none') {
                            alertDiv.innerHTML += `<br><small style="opacity: 0.8;">💡 ${troubleshooting}</small>`;
                        }
                    }, 1000);
                }
            }
            
            showLoading(false);
        });
        
        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert alert-${type}`;
            alert.style.display = 'block';
            
            setTimeout(() => {
                alert.style.display = 'none';
            }, 5000);
        }
        
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
            document.getElementById('admin-login-form').style.display = show ? 'none' : 'block';
        }
        
        async function testConnection() {
            console.log('🔧 Testing server connection...');
            showAlert('Testing connection...', 'info');
            
            const tests = [];
            
            // Test 1: Check if we're online
            tests.push({
                name: 'Internet Connection',
                test: () => Promise.resolve(navigator.onLine),
                expected: true
            });
            
            // Test 2: Determine API URL
            let API_BASE_URL;
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                API_BASE_URL = 'http://localhost:8002';
            } else {
                API_BASE_URL = 'https://api.suprexon.space';
            }
            
            // Test 3: Health check
            tests.push({
                name: 'Server Health Check',
                test: async () => {
                    const controller = new AbortController();
                    setTimeout(() => controller.abort(), 10000);
                    
                    const response = await fetch(`${API_BASE_URL}/api/health`, {
                        signal: controller.signal,
                        credentials: 'include'
                    });
                    return response.ok;
                },
                expected: true
            });
            
            // Test 4: CORS check
            tests.push({
                name: 'CORS Configuration',
                test: async () => {
                    const controller = new AbortController();
                    setTimeout(() => controller.abort(), 10000);
                    
                    const response = await fetch(`${API_BASE_URL}/api/compatibility`, {
                        signal: controller.signal,
                        credentials: 'include'
                    });
                    return response.ok;
                },
                expected: true
            });
            
            let results = [];
            for (const test of tests) {
                try {
                    const result = await test.test();
                    results.push({
                        name: test.name,
                        passed: result === test.expected,
                        result: result
                    });
                    console.log(`${result === test.expected ? '✅' : '❌'} ${test.name}: ${result}`);
                } catch (error) {
                    results.push({
                        name: test.name,
                        passed: false,
                        error: error.message
                    });
                    console.log(`❌ ${test.name}: ${error.message}`);
                }
            }
            
            // Display results
            const passedTests = results.filter(r => r.passed).length;
            const totalTests = results.length;
            
            let message = `Connection Test Results: ${passedTests}/${totalTests} passed\n\n`;
            let recommendations = [];
            
            results.forEach(result => {
                message += `${result.passed ? '✅' : '❌'} ${result.name}\n`;
                if (!result.passed) {
                    if (result.name === 'Internet Connection') {
                        recommendations.push('Check your internet connection');
                    } else if (result.name === 'Server Health Check') {
                        recommendations.push('Server may be down - try again later or contact support');
                    } else if (result.name === 'CORS Configuration') {
                        recommendations.push('Try a different browser or disable browser extensions');
                    }
                }
            });
            
            if (recommendations.length > 0) {
                message += '\nRecommendations:\n' + recommendations.map(r => `• ${r}`).join('\n');
            }
            
            const alertType = passedTests === totalTests ? 'success' : 'error';
            showAlert(message.replace(/\n/g, '<br>'), alertType);
            
            console.log('🔧 Connection test completed');
        }
    </script>
    
</body>
</html>
