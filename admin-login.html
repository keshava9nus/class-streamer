<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Audio Server</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2d3748 0%, #4a5568 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h1 {
            color: #2d3748;
            font-size: 2.2em;
            margin-bottom: 10px;
        }

        .auth-header p {
            color: #718096;
            font-size: 1em;
        }

        .admin-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #4a5568;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1em;
            background: white;
            z-index: 10;
            position: relative;
        }

        .form-group input:focus {
            outline: none;
            border-color: #4a5568;
            box-shadow: 0 0 0 3px rgba(74, 85, 104, 0.1);
        }

        .form-group input:disabled {
            background: #f7fafc;
            cursor: not-allowed;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: #4a5568;
            color: white;
        }

        .btn-primary:hover {
            background: #2d3748;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #4a5568;
            text-decoration: none;
            display: block;
            text-align: center;
        }

        .btn-secondary:hover {
            background: #cbd5e0;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            display: none;
            text-align: center;
            color: #4a5568;
        }

        .form-links {
            text-align: center;
            margin-top: 20px;
        }

        .form-links a {
            color: #4a5568;
            text-decoration: none;
            margin: 0 10px;
        }

        .form-links a:hover {
            text-decoration: underline;
        }

        .security-notice {
            background: #fff3cd;
            color: #856404;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9em;
            border: 1px solid #ffeaa7;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <div class="admin-icon">👨‍🏫</div>
            <h1>Admin Login</h1>
            <p>Sign in to your administrator account</p>
        </div>

        <div class="security-notice">
            <strong>⚠️ Authorized Personnel Only</strong><br>
            This area is restricted to administrators only.
        </div>

        <div id="alert" class="alert"></div>
        <div id="loading" class="loading">Authenticating...</div>

        <form id="admin-login-form">
            <div class="form-group">
                <label for="admin-email">Email Address</label>
                <input type="email" id="admin-email" required placeholder="Enter your admin email" autocomplete="email">
            </div>

            <div class="form-group">
                <label for="admin-password">Password</label>
                <input type="password" id="admin-password" required placeholder="Enter your password" autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-primary">Sign In</button>
            <a href="index.html" class="btn btn-secondary">← Back to Home</a>
        </form>

        <div class="form-links">
            <a href="admin-register.html">Don't have an account? Register</a> |
            <a href="login.html">Student Login</a>
        </div>
    </div>

    <script>
        console.log('Admin login page loaded');
        
        // Focus on email field immediately
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded');
            const emailField = document.getElementById('admin-email');
            if (emailField) {
                emailField.focus();
                console.log('Email field focused');
            }
        });

        document.getElementById('admin-login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            console.log('Form submitted');
            
            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-password').value;
            
            if (!email) {
                showAlert('Please enter your email address', 'error');
                return;
            }
            
            if (!password) {
                showAlert('Please enter your password', 'error');
                return;
            }
            
            showLoading(true);
            
            try {
                // Auto-detect API base URL
                // Auto-detect API base URL based on current location
                let API_BASE_URL;
                
                if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                    // Local development
                    API_BASE_URL = 'http://localhost:8002';
                } else if (window.location.hostname.includes('github.io')) {
                    // GitHub Pages deployment
                    API_BASE_URL = 'https://misty-sunset-29095.pktriot.net';
                } else {
                    // Other deployments (fallback)
                    API_BASE_URL = 'https://misty-sunset-29095.pktriot.net';
                }
                
                const response = await fetch(`${API_BASE_URL}/auth/admin/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });
                
                const result = await response.json();
                
                if (response.ok && result.success) {
                    console.log('✅ Login successful, storing data and redirecting...', result);
                    showAlert('Login successful! Redirecting...', 'success');
                    
                    // Store admin token and info with enhanced error handling
                    let storageSuccess = false;
                    try {
                        localStorage.setItem('adminToken', result.token);
                        localStorage.setItem('userRole', 'admin');
                        localStorage.setItem('adminId', result.admin.adminId);
                        localStorage.setItem('adminName', result.admin.name);
                        localStorage.setItem('adminEmail', result.admin.email);
                        console.log('✅ Data stored in localStorage');
                        storageSuccess = true;
                    } catch (error) {
                        console.warn('⚠️ localStorage failed, trying sessionStorage:', error);
                        try {
                            // Fallback to sessionStorage for mobile private browsing
                            sessionStorage.setItem('adminToken', result.token);
                            sessionStorage.setItem('userRole', 'admin');
                            sessionStorage.setItem('adminId', result.admin.adminId);
                            sessionStorage.setItem('adminName', result.admin.name);
                            sessionStorage.setItem('adminEmail', result.admin.email);
                            console.log('✅ Data stored in sessionStorage');
                            storageSuccess = true;
                        } catch (sessionError) {
                            console.error('❌ Both localStorage and sessionStorage failed:', sessionError);
                            showAlert('Warning: Storage not available. You may need to login again.', 'warning');
                        }
                    }
                    
                    // Enhanced redirect with multiple fallback methods
                    const redirectToAdmin = () => {
                        console.log('🔄 Attempting redirect to admin panel...');
                        try {
                            // Method 1: Standard href redirect
                            window.location.href = 'admin-ui/index.html';
                        } catch (redirectError) {
                            console.error('❌ Standard redirect failed, trying alternative:', redirectError);
                            try {
                                // Method 2: Location replace (no history entry)
                                window.location.replace('admin-ui/index.html');
                            } catch (replaceError) {
                                console.error('❌ Replace redirect failed, trying assign:', replaceError);
                                try {
                                    // Method 3: Location assign
                                    window.location.assign('admin-ui/index.html');
                                } catch (assignError) {
                                    console.error('❌ All redirect methods failed:', assignError);
                                    showAlert('Redirect failed. Please manually navigate to the admin panel.', 'error');
                                    // Show manual link as last resort
                                    setTimeout(() => {
                                        const linkElement = document.createElement('a');
                                        linkElement.href = 'admin-ui/index.html';
                                        linkElement.textContent = 'Click here to access Admin Panel';
                                        linkElement.style.cssText = 'display: block; text-align: center; margin: 20px; padding: 10px; background: #4CAF50; color: white; text-decoration: none; border-radius: 5px;';
                                        document.body.appendChild(linkElement);
                                    }, 2000);
                                }
                            }
                        }
                    };
                    
                    // Delay redirect to ensure storage completion and show success message
                    setTimeout(redirectToAdmin, 1500);
                    
                } else {
                    console.error('❌ Login failed:', result);
                    showAlert(result.message || result.error || 'Invalid email or password', 'error');
                }
            } catch (error) {
                console.error('Login error:', error);
                showAlert('Login failed. Please check if the server is running.', 'error');
            }
            
            showLoading(false);
        });
        
        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert alert-${type}`;
            alert.style.display = 'block';
            
            setTimeout(() => {
                alert.style.display = 'none';
            }, 5000);
        }
        
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
            document.getElementById('admin-login-form').style.display = show ? 'none' : 'block';
        }
    </script>
    
    <!-- Browser Compatibility Detection -->
    <script src="js/browser-compatibility.js"></script>
</body>
</html>
